name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # theme.css must match src/theme.css and the current mistpine spec.
    uses: mistpine/port-kit/.github/workflows/port.yml@v0.1.0
